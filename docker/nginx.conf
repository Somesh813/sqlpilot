server_tokens off;

server {
  listen 80;
  server_name _;
  client_max_body_size 2m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # HSTS belongs on the TLS-terminating proxy in front of this container.
  root /usr/share/nginx/html;
  index index.html;

  # Static assets — long cache
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy API calls to the backend service
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx is the edge here, so it REPLACES any client-supplied X-Forwarded-For with the real
    # peer address. The backend runs with TRUST_PROXY_HOPS=1 and reads exactly that one hop.
    # If another load balancer sits in front of nginx, use $proxy_add_x_forwarded_for and set
    # TRUST_PROXY_HOPS=2 instead.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
